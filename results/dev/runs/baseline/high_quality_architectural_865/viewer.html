  #info { position:fixed; bottom:12px; left:12px; max-width:min(420px, calc(100% - 24px)); font-size:12px; color:var(--muted); }
  #help { position:fixed; bottom:12px; right:12px; font-size:12px; color:var(--muted); max-width:calc(100% - 24px); }
  .lbl { font:12px system-ui,sans-serif; color:#111; background:#ffffffd9; border-radius:6px; padding:2px 6px; white-space:nowrap; text-align:center; pointer-events:none; }
  .lbl b { display:block; font-size:12px; }
  .lbl span { color:#555; font-size:11px; }
  #cross { position:fixed; left:50%; top:50%; width:8px; height:8px; margin:-4px 0 0 -4px; border-radius:50%; border:2px solid #fff8; display:none; }
</style>

<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { PointerLockControls } from "three/addons/controls/PointerLockControls.js";
import { CSS2DRenderer, CSS2DObject } from "three/addons/renderers/CSS2DRenderer.js";

const L = JSON.parse(document.getElementById("layout-data").textContent);
const s = L.meters_per_px;
const W = L.width * s, H = L.height * s;
const wallH = (L.meta && L.meta.wall_height_m) || 2.7;

const app = document.getElementById("app");
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
app.appendChild(renderer.domElement);
const labelR = new CSS2DRenderer();
labelR.setSize(innerWidth, innerHeight);
Object.assign(labelR.domElement.style, { position: "fixed", top: 0, left: 0, pointerEvents: "none" });
document.body.appendChild(labelR.domElement);

const scene = new THREE.Scene();
const dark = matchMedia("(prefers-color-scheme: dark)").matches;
scene.background = new THREE.Color(dark ? 0x16171a : 0xf4f3ef);
const cam = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.05, 500);
const center = new THREE.Vector3(W / 2, 0, H / 2);
const span = Math.max(W, H);
cam.position.set(center.x + span * 0.55, span * 0.85, center.z + span * 0.75);

scene.add(new THREE.HemisphereLight(0xffffff, 0x9a948a, 1.1));
const sun = new THREE.DirectionalLight(0xffffff, 1.4);
sun.position.set(center.x + span, span * 1.5, center.z + span * 0.6);
sun.target.position.copy(center);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -span, right: span, top: span, bottom: -span, far: span * 5 });
scene.add(sun, sun.target);

const ground = new THREE.Mesh(new THREE.PlaneGeometry(span * 4, span * 4),
  new THREE.MeshStandardMaterial({ color: dark ? 0x202226 : 0xe6e3dc, roughness: 1 }));
ground.rotation.x = -Math.PI / 2; ground.position.set(center.x, -0.03, center.z); ground.receiveShadow = true;
scene.add(ground);

// 2D plan overlay
const planTex = new THREE.TextureLoader().load("data:image/jpeg;base64," + window.PLAN_B64);
planTex.colorSpace = THREE.SRGBColorSpace;
const plan = new THREE.Mesh(new THREE.PlaneGeometry(W, H), new THREE.MeshBasicMaterial({ map: planTex, transparent: true, opacity: 0.95 }));
plan.rotation.x = -Math.PI / 2; plan.position.set(W / 2, 0.012, H / 2); plan.visible = false;
scene.add(plan);

// model
const walls = [];
let model, ceiling = null;
const bin = Uint8Array.from(atob(window.GLB_B64), c => c.charCodeAt(0));
new GLTFLoader().parse(bin.buffer, "", g => {
  model = g.scene;
  model.traverse(o => {
    if (!o.isMesh) return;
    o.castShadow = o.receiveShadow = true;
    if (/^walls|^railings|^door/.test(o.name) || /^walls|^railings|^door/.test(o.parent?.name || "")) walls.push(o);
  });
  scene.add(model);
  // ceiling (toggle) from room polygons
  const shapes = L.rooms.filter(r => r.polygon.length >= 3).map(r => new THREE.Shape(r.polygon.map(p => new THREE.Vector2(p[0] * s, p[1] * s))));
  if (shapes.length) {
    const geo = new THREE.ShapeGeometry(shapes);
    geo.rotateX(Math.PI / 2);  // shape (x, y) -> world (x, ., y), facing down
    ceiling = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ color: 0xfafafa, side: THREE.DoubleSide }));
    ceiling.position.y = wallH; ceiling.visible = false; scene.add(ceiling);
  }
}, e => { document.getElementById("info").textContent = "Failed to load model: " + e; });

// labels
const labels = [];
function polyArea(P) { let a = 0; for (let i = 0; i < P.length; i++) { const [x1, y1] = P[i], [x2, y2] = P[(i + 1) % P.length]; a += x1 * y2 - x2 * y1; } return Math.abs(a) / 2; }
function rectDims(P) {  // axis-aligned extent is a good proxy for these plans
  const xs = P.map(p => p[0]), ys = P.map(p => p[1]);
  return [(Math.max(...xs) - Math.min(...xs)) * s, (Math.max(...ys) - Math.min(...ys)) * s];
}
function centroid(P) { let cx = 0, cy = 0, a = 0; for (let i = 0; i < P.length; i++) { const [x1, y1] = P[i], [x2, y2] = P[(i + 1) % P.length]; const f = x1 * y2 - x2 * y1; a += f; cx += (x1 + x2) * f; cy += (y1 + y2) * f; } a *= 0.5; return a ? [cx / (6 * a), cy / (6 * a)] : P[0]; }
let totalA = 0;
for (const r of L.rooms) {
  if (r.polygon.length < 3) continue;
  const A = polyArea(r.polygon) * s * s; totalA += r.type !== "Outdoor" ? A : 0;
  const [w, d] = rectDims(r.polygon);
  const [cx, cy] = centroid(r.polygon);
  const el = document.createElement("div"); el.className = "lbl";
  const name = (r.label || (r.type === "Undefined" ? "Room" : r.type) || "Room").slice(0, 28);
  el.innerHTML = `<b></b><span>${w.toFixed(2)} × ${d.toFixed(2)} m · ${A.toFixed(1)} m²</span>`;
  el.querySelector("b").textContent = name;
  const o = new CSS2DObject(el); o.position.set(cx * s, 1.2, cy * s); scene.add(o); labels.push(o);
}
const nDoor = L.openings.filter(o => o.type === "door").length, nWin = L.openings.length - nDoor;
document.getElementById("info").textContent =
  `${L.rooms.length} rooms · ${nDoor} doors · ${nWin} windows · ${totalA.toFixed(1)} m² interior · ` +
  `${W.toFixed(1)} × ${H.toFixed(1)} m · scale ${(s * 1000).toFixed(2)} mm/px (${L.scale_source})`;
document.getElementById("title").textContent = (L.meta && L.meta.method === "baseline") ? "Baseline" : "Floor Plan 3D";

// controls
const orbit = new OrbitControls(cam, renderer.domElement);
orbit.target.copy(center); orbit.maxPolarAngle = Math.PI * 0.495; orbit.enableDamping = true; orbit.update();
const walk = new PointerLockControls(cam, document.body);
const keys = {};
addEventListener("keydown", e => keys[e.code] = true);
addEventListener("keyup", e => keys[e.code] = false);
let mode = "orbit";
const btn = id => document.getElementById(id);
function setPressed(id, v) { btn(id).setAttribute("aria-pressed", String(v)); }
function setMode(m) {
  mode = m; setPressed("bOrbit", m === "orbit"); setPressed("bWalk", m === "walk");
  orbit.enabled = m === "orbit"; document.getElementById("cross").style.display = m === "walk" ? "block" : "none";
  if (m === "walk") {
    // start at the centroid of the largest room, eye height 1.6 m
    const big = [...L.rooms].filter(r => r.polygon.length >= 3).sort((a, b) => polyArea(b.polygon) - polyArea(a.polygon))[0];
    const [cx, cy] = big ? centroid(big.polygon) : [L.width / 2, L.height / 2];
    cam.position.set(cx * s, 1.6, cy * s); cam.lookAt(cx * s + 1, 1.6, cy * s);
    walk.lock();
  } else {
    walk.unlock(); cam.position.set(center.x + span * 0.55, span * 0.85, center.z + span * 0.75); orbit.target.copy(center); orbit.update();
  }
}
walk.addEventListener("unlock", () => { if (mode === "walk") setMode("orbit"); });
btn("bOrbit").onclick = () => setMode("orbit");
btn("bWalk").onclick = () => setMode("walk");
btn("bPlan").onclick = () => {
  const on = btn("bPlan").getAttribute("aria-pressed") !== "true"; setPressed("bPlan", on);
  plan.visible = on;
  if (model) model.traverse(o => { if (o.isMesh && !/^floor/.test(o.name)) { o.material.transparent = on || o.material.userData.wasT; if (o.material.userData.op === undefined) { o.material.userData.op = o.material.opacity; o.material.userData.wasT = o.material.transparent; } o.material.opacity = on ? 0.25 : o.material.userData.op; } });
  if (on) { setMode("orbit"); cam.position.set(center.x, span * 1.3, center.z + 0.001); orbit.target.copy(center); orbit.update(); }
};
btn("bLabels").onclick = () => { const on = btn("bLabels").getAttribute("aria-pressed") !== "true"; setPressed("bLabels", on); labels.forEach(l => l.visible = on); };
btn("bCeil").onclick = () => { const on = btn("bCeil").getAttribute("aria-pressed") !== "true"; setPressed("bCeil", on); if (ceiling) ceiling.visible = on; };

// walk with simple wall collision
const ray = new THREE.Raycaster();
const clock = new THREE.Clock();
function step(dt) {
  const f = (keys.KeyW || keys.ArrowUp ? 1 : 0) - (keys.KeyS || keys.ArrowDown ? 1 : 0);
  const r = (keys.KeyD || keys.ArrowRight ? 1 : 0) - (keys.KeyA || keys.ArrowLeft ? 1 : 0);
  if (!f && !r) return;
  const dir = new THREE.Vector3(); cam.getWorldDirection(dir); dir.y = 0; dir.normalize();
  const side = new THREE.Vector3().crossVectors(dir, new THREE.Vector3(0, 1, 0));
  const mv = dir.multiplyScalar(f).add(side.multiplyScalar(r)).normalize();
  const dist = 1.6 * dt * (keys.ShiftLeft ? 2 : 1);
  for (const h of [0.4, 1.2]) {   // knee and chest height, so door frames block but openings don't
    ray.set(new THREE.Vector3(cam.position.x, h, cam.position.z), mv); ray.far = dist + 0.25;
    if (ray.intersectObjects(walls, true).length) return;
  }
  cam.position.addScaledVector(mv, dist);
}
function loop() {
  const dt = Math.min(clock.getDelta(), 0.05);
  if (mode === "walk") step(dt); else orbit.update();
  renderer.render(scene, cam); labelR.render(scene, cam);
  requestAnimationFrame(loop);
}
loop();
addEventListener("resize", () => {
  cam.aspect = innerWidth / innerHeight; cam.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight); labelR.setSize(innerWidth, innerHeight);
});
</script>
